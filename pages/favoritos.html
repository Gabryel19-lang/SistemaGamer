<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">


    <link
    rel="icon"
    type="image/png"
    href="../assets/img/favicon.png"
>


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Produtos favoritos - NextXP Gaming"
    >

    <title>Favoritos | NextXP Gaming</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>


<body class="favorites-page">


    <!-- ==================================================
         CABEÇALHO
    =================================================== -->
    <header class="favorites-header">

        <div class="container favorites-header-content">


            <a href="../index.html">

                <img
                    src="../assets/img/logo-nextxp.png"
                    alt="NextXP Gaming"
                    class="favorites-logo"
                >

            </a>


            <a
                href="../index.html"
                class="favorites-back"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Voltar para a loja

            </a>


        </div>

    </header>



    <!-- ==================================================
         CONTEÚDO
    =================================================== -->
    <main class="favorites-main">

        <div class="container">


            <!-- TÍTULO -->
            <div class="favorites-title">

                <span>
                    NEXTXP GAMING
                </span>

                <h1>
                    Meus Favoritos
                </h1>

                <p>
                    Seus produtos preferidos ficam salvos aqui.
                </p>

            </div>



            <!-- INFORMAÇÕES -->
            <div class="favorites-info">

                <div>

                    <i class="fa-solid fa-heart"></i>

                    <span id="favoritesCount">
                        0 produtos favoritos
                    </span>

                </div>


                <a href="../index.html#ofertas">

                    <i class="fa-solid fa-plus"></i>

                    Adicionar produtos

                </a>

            </div>



            <!-- LISTA DOS FAVORITOS -->
            <section
                class="favorites-grid"
                id="favoritesList"
            >


                <!-- ESTADO VAZIO -->
                <div
                    class="favorites-empty"
                    id="favoritesEmpty"
                >

                    <div class="favorites-empty-icon">

                        <i class="fa-regular fa-heart"></i>

                    </div>


                    <h2>
                        Nenhum favorito ainda
                    </h2>


                    <p>
                        Clique no coração dos produtos para
                        adicioná-los aos seus favoritos.
                    </p>


                    <a
                        href="../index.html#ofertas"
                        class="favorites-shop-button"
                    >

                        <i class="fa-solid fa-gamepad"></i>

                        Ver produtos

                    </a>

                </div>


            </section>


        </div>

    </main>



    <!-- ==================================================
         RODAPÉ
    =================================================== -->
    <footer class="favorites-footer">

        <div class="container favorites-footer-content">

            <img
                src="../assets/img/logo-nextxp.png"
                alt="NextXP Gaming"
            >

            <p>
                © 2026 NextXP Gaming.
                Todos os direitos reservados.
            </p>

        </div>

    </footer>



    <script src="../script.js"></script>

</body>

</html>
