name: Fix NextXP favicon

on:
  push:
    paths:
      - '.github/workflows/fix-favicon.yml'

permissions:
  contents: write

jobs:
  fix-favicon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Normalize favicon image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('assets/img/favicon.png')
          if not path.exists():
              raise SystemExit('assets/img/favicon.png não encontrado')

          with Image.open(path) as image:
              image = image.convert('RGBA')
              image.thumbnail((64, 64), Image.Resampling.LANCZOS)

              canvas = Image.new('RGBA', (64, 64), (0, 0, 0, 0))
              x = (64 - image.width) // 2
              y = (64 - image.height) // 2
              canvas.paste(image, (x, y), image)
              canvas.save(path, format='PNG', optimize=True)
          PY

      - name: Add favicon to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue

              text = path.read_text(encoding='utf-8')

              favicon_href = '../assets/img/favicon.png' if 'pages' in path.parts else 'assets/img/favicon.png'
              favicon_tag = f'<link rel="icon" type="image/png" href="{favicon_href}">'

              icon_pattern = re.compile(
                  r'<link\b(?=[^>]*\brel=["\'][^"\']*\bicon\b[^"\']*["\'])[^>]*>',
                  flags=re.IGNORECASE | re.DOTALL,
              )

              if icon_pattern.search(text):
                  text = icon_pattern.sub(favicon_tag, text, count=1)
              else:
                  title_match = re.search(r'</title>', text, flags=re.IGNORECASE)
                  if title_match:
                      pos = title_match.end()
                      text = text[:pos] + '\n\n    ' + favicon_tag + text[pos:]
                  else:
                      head_match = re.search(r'<head[^>]*>', text, flags=re.IGNORECASE)
                      if head_match:
                          pos = head_match.end()
                          text = text[:pos] + '\n    ' + favicon_tag + text[pos:]

              path.write_text(text, encoding='utf-8', newline='')
          PY

      - name: Commit favicon fixes
        run: |
          git config user.name "NextXP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img/favicon.png '*.html' 'pages/*.html'

          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi

          git commit -m "Corrige favicon em todas as páginas"
          git push
